<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 20px 0;
    font-size: 16px;
    text-align: left;
  }

  th, td {
    border: 1px solid #ddd;
    padding: 12px 15px;
  }

  th {
    background-color: #4CAF50;
    color: white;
    font-weight: bold;
    text-align: center;
  }

  tr:nth-child(even) {
    background-color: #f9f9f9;
  }

  tr:hover {
    background-color: #f1f1f1;
    transition: 0.3s;
  }
</style>

</head>
<body>
    <table>
        <thead>
            <tr>
                <th>
                    name
                </th>
                <th>subject</th>
                <th>marks</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>prince</td>
                <td>maths</td>
                <td>90</td>
            </tr>
            <tr>
                <td>krishna</td>
                <td>science</td>
                <td>78</td>
            </tr>
            <tr>
                <td>janak</td>
                <td>english</td>
                <td>85</td>
            </tr>
            <tr>
                <td>chirag</td>
                <td>hindi</td>
                <td>87</td>
            </tr>
        </tbody>


    </table>
</body>
</html>
